<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>异轨 · 自动测试</title><style>body{font:15px/1.8 system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#e8edf1;color:#203342}a{color:#175ea8}.pass{color:#236c60}.fail{color:#9a382b}li{margin:5px 0}pre{white-space:pre-wrap}h1{font-size:25px}</style></head><body><a href="../">返回游戏</a><h1>规则、关卡与控制器测试</h1><p id="summary" role="status">正在执行…</p><ol id="results"></ol><script type="module">
import './rules.test.js';
import './levels.test.js';
import './input.test.js';
import './ui.test.js';
import { run } from './harness.js';
const results = await run((result) => {
  const item = document.createElement('li'); item.className = result.ok ? 'pass' : 'fail'; item.textContent = `${result.ok ? '通过' : '失败'}：${result.name}`;
  if (result.error) { const error = document.createElement('pre'); error.textContent = result.error; item.append(error); }
  document.querySelector('#results').append(item);
});
const failed = results.filter((result) => !result.ok).length;
document.querySelector('#summary').textContent = `${results.length - failed}/${results.length} 项通过。${failed ? '存在失败，请查看详情。' : '全部通过。'}实体板烧录与 USB 通信仍需实物验证。`;
document.documentElement.dataset.testResult = failed ? 'failed' : 'passed';
</script></body></html>
