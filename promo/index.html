<!doctype html>
<html lang="zh-CN" data-theme-scene="meadow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小星快递 · 宣传片</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="promo.css">
  <script type="module" src="promo.js"></script>
</head>
<body class="promo">
  <div id="stage">
    <div class="p-sky s-meadow"></div><div class="p-sky s-forest"></div><div class="p-sky s-snow"></div><div class="p-sky s-night"></div>
    <div class="p-stars"></div>
    <div class="p-sun"></div><div class="p-moon"></div>
    <div class="p-cloud a"></div><div class="p-cloud b"></div><div class="p-cloud c"></div><div class="p-cloud d"></div>
    <svg class="p-hills back" viewBox="0 0 1920 420" preserveAspectRatio="none"><path d="M0 250 C260 120 520 300 820 210 C1120 120 1380 290 1660 190 C1790 150 1870 170 1920 190 V420 H0Z" fill="var(--hill-back)"/></svg>
    <svg class="p-hills front" viewBox="0 0 1920 420" preserveAspectRatio="none"><path d="M0 330 C340 230 620 400 1010 320 C1360 250 1600 380 1920 300 V420 H0Z" fill="var(--hill-front)"/></svg>
    <div class="p-bokeh" id="bokeh"></div>
    <div id="scenes"></div>
    <div class="p-swoosh" id="swoosh"><i></i><i></i><i></i></div>
    <div class="p-confetti" id="confetti"></div>
    <div class="p-vignette"></div>
    <div class="p-fade" id="fade"></div>
  </div>
</body>
</html>
